<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | TYGERR</title>
  <meta name="description" content="Digital and traditional artwork by Jaleesa Zachery.">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Gallery styles. Colors come from the variables in style.css. */
    .controls { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: center; margin: 1rem 0; }
    .controls button, #more, #clearTag, dialog button {
      font: inherit; padding: 0.35rem 0.8rem; border: 1px solid var(--text);
      background: var(--bg); color: var(--text); cursor: pointer;
    }
    .controls button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .controls input { font: inherit; padding: 0.35rem; border: 1px solid var(--text); }
    #status { color: var(--muted); }
    .grid { list-style: none; margin: 1rem 0; padding: 0; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; }
    .thumb { display: block; width: 100%; padding: 0; border: 0; background: var(--line); cursor: pointer; }
    .thumb img, .thumb .ph { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
    .thumb .ph { background: var(--line); }
    #more { display: block; margin: 1.5rem auto; }
    dialog { max-width: 900px; width: 92%; border: 1px solid var(--text); background: var(--bg); color: var(--text); padding: 1rem; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
    dialog img { max-height: 70vh; margin: 0 auto; display: block; }
    dialog .ph { width: 100%; aspect-ratio: 4 / 3; background: var(--line); }
    #lbTags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }

    /* Previous / next arrows on either side of the "3 / 257" counter, under the picture */
    .lb-stage { touch-action: pan-y; }   /* lets phones swipe sideways on the picture */
    .lb-nav { display: flex; align-items: center; justify-content: center; gap: 1.25rem; margin-top: 0.75rem; }
    .lb-nav[hidden] { display: none; }
    dialog .lb-arrow { flex: none;
                width: 2.75rem; height: 2.75rem; padding: 0; border: 0; border-radius: 50%;
                display: flex; align-items: center; justify-content: center;   /* centers the < in the circle */
                background: var(--line); color: var(--text); }   /* same look as the commissions pop-up's close button */
    dialog .lb-arrow svg { width: 1.4rem; height: 1.4rem; display: block; }
    dialog .lb-arrow:hover, dialog .lb-arrow:focus-visible { background: var(--accent); color: var(--bg); }
    dialog .lb-arrow:focus:not(:focus-visible) { outline: none; }
    #lbCount { color: var(--muted); font-size: 0.95rem; margin: 0; min-width: 5.5rem; text-align: center;
               font-variant-numeric: tabular-nums; }   /* keeps the arrows still as the numbers change */
  </style>
<link rel="icon" href="/images/favicon.ico" sizes="any">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
</head>
<body>

  <header>
    <nav aria-label="Main">
      <ul>
        <li><a href="index.html">About Me</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="gallery.html" aria-current="page">Art Gallery</a></li>
        <li><a href="store.html">Store</a></li>
        <li><a href="commissions.html">Commission Inquiry</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="card">
    <h1>Gallery</h1>
    <p>A random mix of my work. Pick a medium, search, or click a tag to find related pieces.</p>

    <div class="controls">
      <div role="group" aria-label="Medium">
        <button type="button" data-medium="all" aria-pressed="true">All</button>
        <button type="button" data-medium="digital" aria-pressed="false">Digital</button>
        <button type="button" data-medium="traditional" aria-pressed="false">Traditional</button>
        <button type="button" data-medium="mixed media" aria-pressed="false">Mixed Media</button>
      </div>
      <label>Search <input type="search" id="q" placeholder="title or tag"></label>
      <button type="button" id="shuffle">Shuffle</button>
    </div>

    <p id="activeTag" hidden>Tag: <strong id="tagName"></strong> <button type="button" id="clearTag">Clear tag</button></p>
    <p id="status" aria-live="polite"></p>

    <ul id="grid" class="grid"></ul>
    <button type="button" id="more" hidden>Load more</button>

    <dialog id="lightbox" aria-labelledby="lbTitle">
      <div class="lb-stage">
        <div id="lbImg"></div>
      </div>
      <div class="lb-nav">
        <button type="button" class="lb-arrow" id="lbPrev" aria-label="Previous piece"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
        <p id="lbCount" aria-live="polite"></p>
        <button type="button" class="lb-arrow" id="lbNext" aria-label="Next piece"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
      </div>
      <h2 id="lbTitle"></h2>
      <p id="lbMeta"></p>
      <div id="lbTags"></div>
      <button type="button" id="lbClose" autofocus>Close</button>
    </dialog>
  </main>

  <footer>
    <p>&copy; 2026 Jaleesa Zachery. All artwork is copyrighted and may not be used without permission.</p>
  </footer>

  <script src="artworks.js"></script>
  <script>
    const PAGE = 48;                       // how many pieces to show at a time
    let medium = "all", tag = "", query = "", order = [], current = [], shown = 0;

    const $ = id => document.getElementById(id);
    const grid = $("grid"), lb = $("lightbox");

    function shuffle(arr) {
      arr = arr.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function matches(a) {
      if (medium !== "all" && a.medium !== medium) return false;
      if (tag && !a.tags.includes(tag)) return false;
      if (query) {
        const text = (a.title + " " + a.tags.join(" ")).toLowerCase();
        if (!text.includes(query)) return false;
      }
      return true;
    }

    function makeImage(src, alt, cls) {
      if (!src) { const d = document.createElement("div"); d.className = "ph"; return d; }
      const img = document.createElement("img");
      img.src = src; img.alt = alt; img.loading = "lazy";
      return img;
    }

    function refresh(reshuffle) {
      if (reshuffle || !order.length) order = shuffle(ARTWORKS.map((_, i) => i));
      current = order.filter(i => matches(ARTWORKS[i]));
      grid.innerHTML = ""; shown = 0;
      $("status").textContent = current.length + (current.length === 1 ? " piece" : " pieces");
      $("activeTag").hidden = !tag; $("tagName").textContent = tag;
      showMore();
    }

    function showMore() {
      current.slice(shown, shown + PAGE).forEach((i, k) => {
        const a = ARTWORKS[i], li = document.createElement("li"), b = document.createElement("button");
        b.type = "button"; b.className = "thumb"; b.setAttribute("aria-label", "View " + a.title);
        b.appendChild(makeImage(a.thumb, a.title));
        const place = shown + k;   // this piece's place in the filtered list
        b.addEventListener("click", () => openLightbox(place));
        li.appendChild(b); grid.appendChild(li);
      });
      shown = Math.min(shown + PAGE, current.length);
      $("more").hidden = shown >= current.length;
    }

    /* Pop-up viewer. "pos" is the piece's place in the current (filtered, shuffled) list,
       so the arrows step through exactly what the grid shows, and wrap around at the ends. */
    let pos = 0;

    function openLightbox(p) {
      pos = (p + current.length) % current.length;
      const a = ARTWORKS[current[pos]];
      const many = current.length > 1;
      lb.querySelector(".lb-nav").hidden = !many;
      $("lbCount").textContent = (pos + 1) + " / " + current.length;
      $("lbImg").replaceChildren(makeImage(a.full || a.thumb, a.title));
      // Load the next and previous pictures in the background so arrowing feels instant
      [pos + 1, pos - 1].forEach(n => {
        const next = ARTWORKS[current[(n + current.length) % current.length]];
        if (next.full) new Image().src = next.full;
      });
      $("lbTitle").textContent = a.title;
      $("lbMeta").textContent = a.medium.charAt(0).toUpperCase() + a.medium.slice(1);
      $("lbTags").replaceChildren(...a.tags.map(t => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = t;
        b.addEventListener("click", () => { tag = t; lb.close(); refresh(false); window.scrollTo(0, 0); });
        return b;
      }));
      if (!lb.open) lb.showModal();
    }

    const step = by => openLightbox(pos + by);
    $("lbPrev").addEventListener("click", () => step(-1));
    $("lbNext").addEventListener("click", () => step(1));

    // Keyboard: left and right arrow keys (Escape already closes the pop-up)
    lb.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
      if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    });

    // Phones: swipe left or right on the picture
    let touchX = null, touchY = null;
    const stage = lb.querySelector(".lb-stage");
    stage.addEventListener("touchstart", e => {
      touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    }, { passive: true });
    stage.addEventListener("touchend", e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    document.querySelectorAll("[data-medium]").forEach(b => b.addEventListener("click", () => {
      medium = b.dataset.medium;
      document.querySelectorAll("[data-medium]").forEach(x => x.setAttribute("aria-pressed", x === b));
      refresh(false);
    }));
    $("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); refresh(false); });
    $("shuffle").addEventListener("click", () => refresh(true));
    $("clearTag").addEventListener("click", () => { tag = ""; refresh(false); });
    $("more").addEventListener("click", showMore);
    $("lbClose").addEventListener("click", () => lb.close());
    lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });   // click outside to close

    refresh(true);
  </script>

</body>
</html>
